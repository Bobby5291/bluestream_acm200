switch_route:
  name: Switch Route
  description: Route a matrix input to a matrix output on the Blustream ACM200.
  fields:
    output:
      name: Output
      description: Output number to route to (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 32
          step: 1
          mode: box
    input:
      name: Input
      description: Input number to route from (1-based).
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 32
          step: 1
          mode: box
    entry_id:
      name: Config Entry ID
      description: >
        Optional. When multiple ACM200 devices are configured, set this to the
        config entry ID of the device you want to control. Leave blank to target
        the first configured device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text: {}
